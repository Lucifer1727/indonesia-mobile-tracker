name: Daily phone launch crawl

on:
  schedule:
    # 02:30 UTC = 08:00 IST (Asia/Kolkata) daily, plus 03:30 UTC backup.
    # Backup is harmless: seen-state dedupe means it only emails if the first run missed.
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      send_empty:
        description: "Send email even if no new items (test)"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check email secrets
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          [ -n "$GMAIL_USER" ] || { echo "::error::GMAIL_USER secret is missing. Add it under repo Settings → Secrets → Actions."; exit 1; }
          [ -n "$GMAIL_APP_PASSWORD" ] || { echo "::error::GMAIL_APP_PASSWORD secret is missing. Add it under repo Settings → Secrets → Actions."; exit 1; }

      - name: Crawl + email digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SEND_EMPTY_EMAIL: ${{ github.event.inputs.send_empty == 'true' && 'true' || 'false' }}
        run: npm start

      - name: Save updated state
        run: |
          git config user.name "phone-tracker-bot"
          git config user.email "phone-tracker-bot@users.noreply.github.com"
          git add state/last_seen.json || true
          git diff --cached --quiet || git commit -m "Update seen state $(date -u +%F)"
          git push || true
